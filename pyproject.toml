[project]
name = "brainco-scene-acquisition"
version = "0.2.0"
description = "BrainCo 32-channel full-scene visual EEG task"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2.6,<2.3", "Pillow>=10,<12", "PySide6>=6.6,<7",
  "PyYAML>=6,<7", "typer>=0.12,<1", "tzdata>=2024.1",
  "zeroconf==0.151.5", "ifaddr==0.2.0", "boto3>=1.35,<2",
  "bc-ecap-sdk==0.5.0; sys_platform == 'win32'",
]
[dependency-groups]
dev = ["pytest>=8,<9"]
assets = ["dvc[s3]>=3,<4"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
